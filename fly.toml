# fly.toml app configuration file generated for cuekeeper on 2026-10-14T01:40:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cuekeeper'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'ero_cuts_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
